\* The code as it should be: a stale answer is dropped, Set Up Agent asks the live page again, and a
\* start runs one agent at a time in a terminal, leaving Pair in front and the setting alone; and the
\* click shows a note until a session starts or the agent exits.
SPECIFICATION Spec
CONSTANTS
    Pages = 3
    Flips = 2
    Clicks = 2
    DropStale = TRUE
    ReaskOnSetUp = TRUE
    InTerminal = TRUE
    OneAgent = TRUE
    NoteOnClick = TRUE
    ClearOnExit = TRUE
INVARIANTS TypeOK OwnAnswer RunsAreClicks KeepsLocation StaysOnPair OneAtATime NoteUntilSession
PROPERTIES Grounded ClicksNeedButton Offered Reasked Starts Closes Acknowledged Settles
CHECK_DEADLOCK FALSE
