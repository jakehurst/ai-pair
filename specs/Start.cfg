\* The code as it should be: a stale answer is dropped, Set Up Agent asks the live page again, and a
\* start runs one agent at a time in a terminal, leaving Pair in front and the setting alone.
SPECIFICATION Spec
CONSTANTS
    Pages = 3
    Flips = 2
    Clicks = 2
    DropStale = TRUE
    ReaskOnSetUp = TRUE
    InTerminal = TRUE
    OneAgent = TRUE
INVARIANTS TypeOK OwnAnswer RunsAreClicks KeepsLocation StaysOnPair OneAtATime
PROPERTIES Grounded ClicksNeedButton Offered Reasked Starts Closes
CHECK_DEADLOCK FALSE
