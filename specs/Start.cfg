\* The code as it should be: a stale answer is dropped, Set Up Agent asks the
\* live page again, and a start runs one agent at a time in a terminal, leaving
\* Pair in front and the setting alone; and the click shows a note until a
\* session starts or the agent exits. Expected to pass.

SPECIFICATION Spec

CONSTANTS
    MaxPages = 3
    MaxFlips = 2
    MaxClicks = 2
    DropStale = TRUE
    ReaskOnSetUp = TRUE
    InTerminal = TRUE
    OneAgent = TRUE
    NoteOnClick = TRUE
    ClearOnExit = TRUE
    NoPage = NoPage

INVARIANTS
    TypeOK
    OwnAnswer
    LatestAnswer
    RunsAreClicks
    KeepsLocation
    StaysOnPair
    OneAtATime
    NoteUntilSession

PROPERTIES
    GroundedProp
    ClicksNeedButtonProp
    Offered
    ReaskedProp
    StartsProp
    Closes
    AcknowledgedProp
    Settles

\* Pages, flips, and clicks are bounded only to keep the model finite (6.8).
\* The spec's comment on Constraint says why it is sound beside the liveness
\* properties (8.6).
CONSTRAINT
    Constraint

CHECK_DEADLOCK TRUE
