          <button

          ><svg
    class="i "
    viewbox="0 0 24 24"
    fill="none"
    stroke="currentcolor"

          </div>

            <div data-ui="reading-menu" class="speed-menu" role="menu" aria-label="Reading speed" hidden><button type="button" role="menuitemradio" aria-checked="false" data-speed="0.4">0.4x</button><button type="button" role="menuitemradio" aria-checked="false" data-speed="0.6">0.6x</button><button type="button" role="menuitemradio" aria-checked="false" data-speed="1">1.0x</button><button type="button" role="menuitemradio" aria-checked="false" data-speed="1.5">1.5x</button><button type="button" role="menuitemradio" aria-checked="false" data-speed="2">2.0x</button><button type="button" role="menuitemradio" aria-checked="false" data-speed="3">3.0x</button></div>

    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  ><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h11"/></svg></button>
        </div>
      </div>
      <div class="now">
        <div data-ui="now-text" class="now-text empty" aria-live="polite"></div>

      <div class="idle">

    </div>
    <div class="composer">
      <div data-ui="attach" class="attach">
        <span>With selection</span>
        <span data-ui="attach-ref" class="attach-ref"></span>

          class="quiet"
          aria-label="Don't send the selection"

          class="reply"

        <button type="button" data-ui="send" class="quiet" aria-label="Send" data-tip="Send (Enter)"><svg

    viewbox="0 0 24 24"
    fill="none"
    stroke="currentcolor"

    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  ><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
      </div>
    </div>
  </div>
  <section data-ui="history" class="history" aria-label="Earlier, newest first"></section>
</div>
<div data-ui="tip" class="tip" role="tooltip" hidden></div>
