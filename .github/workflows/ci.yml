# Lint, type check, and unit tests; the integration test in a real VS Code, downloaded, on a
# virtual display; and the TLA+ specs (#7, #19).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download VS Code
        run: echo "VSCODE_BIN=$(node scripts/vscode-bin.mjs | tail -1)" >> "$GITHUB_ENV"
        working-directory: packages/vscode
      - name: Run the integration test
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_ARGS: --no-sandbox --disable-gpu

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # TLA+ tools 1.7.4, the latest stable release, checked against its SHA-256.
      - name: Download TLC
        run: |
          curl -sSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c
      - name: Check every spec
        run: specs/check.sh
        env:
          TLC: java -XX:+UseParallelGC -cp ${{ runner.temp }}/tla2tools.jar tlc2.TLC
