# Lint, type check, unit tests, and the style of the shell scripts (#135), the panel's HTML and CSS
# (#132), and the Markdown (#136); the integration test in a real VS Code, downloaded, on a virtual
# display; the TLA+ specs (#7, #19); and the Swift lint and type check, on macOS (#137).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:ascii
      # shfmt 3.14.1, checked against its SHA-256; the runner image has ShellCheck.
      - name: Install shfmt
        run: |
          curl -sSL -o "$RUNNER_TEMP/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $RUNNER_TEMP/shfmt" | sha256sum -c
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm run lint:sh
      # vnu, the Nu Html Checker, runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run lint:web
      - run: npm run lint:md
      - run: npm run typecheck
      - run: npm test

  swift:
    # Xcode has swift-format, and the SDK with the frameworks the script imports.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: npm run lint:swift
      - run: npm run typecheck:swift

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download VS Code
        run: echo "VSCODE_BIN=$(node scripts/vscode-bin.mjs | tail -1)" >> "$GITHUB_ENV"
        working-directory: packages/vscode
      - name: Run the integration test
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_ARGS: --no-sandbox --disable-gpu

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # TLA+ tools 1.8.0, the newest release, checked against its SHA-256.
      - name: Download TLC
        run: |
          curl -sSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c
      - name: Check every spec
        run: specs/check.sh
        env:
          TLC: java -XX:+UseParallelGC -cp ${{ runner.temp }}/tla2tools.jar tlc2.TLC
